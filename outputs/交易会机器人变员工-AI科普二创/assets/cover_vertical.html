<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}

.body{position:absolute;left:82px;right:82px;top:1090px}

.sub{margin-top:30px;font-size:34px;line-height:1.6;color:#5B4B38}
.checks{margin-top:44px;border-top:1px solid rgba(46,36,28,.3)}
.row{display:flex;gap:22px;align-items:baseline;padding:20px 0;border-bottom:1px solid rgba(46,36,28,.16)}
.no{font-size:22px;color:#8C3B21;min-width:46px;letter-spacing:.16em}
.t{font-size:34px}
.foot{position:absolute;left:82px;right:82px;bottom:70px;display:flex;justify-content:space-between;font-size:22px;letter-spacing:.16em;color:#6E5E48}
