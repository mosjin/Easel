<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1600px;height:900px;overflow:hidden}
body{background:#EFE6D2;color:#2E241C;font-family:"Noto Serif CJK SC","Songti SC",serif;position:relative}
.art{position:absolute;inset:0;overflow:hidden}
.art img{width:100%;height:calc(100% + 40px);object-fit:cover;object-position:72% 42%;filter:sepia(.1) contrast(1.03)}
.wash{position:absolute;inset:0;background:linear-gradient(90deg,rgba(239,230,210,.98) 0%,rgba(239,230,210,.95) 38%,rgba(239,230,210,.7) 55%,rgba(239,230,210,0) 72%)}
.frame{position:absolute;inset:34px;border:1px solid rgba(46,36,28,.25)}
.frame:before,.frame:after{content:"";position:absolute;width:12px;height:12px;background:#8C3B21}
.frame:before{left:-1px;top:-1px} .frame:after{right:-1px;bottom:-1px}
.top{position:absolute;left:64px;top:56px;display:flex;gap:12px;align-items:center;font-size:15px;letter-spacing:.26em;color:#7A6A52}
.top b{color:#8C3B21}
.top .r{width:40px;height:1px;background:#8C3B21}
h1{position:absolute;left:64px;top:190px;font-size:92px;line-height:1.2;font-weight:700}
h1 em{font-style:normal;color:#8C3B21}
.sub{position:absolute;left:64px;top:470px;font-size:27px;line-height:1.6;color:#5B4B38}
.checks{position:absolute;left:64px;top:580px;display:flex;gap:0;border-top:1px solid rgba(46,36,28,.3)}
.chk{padding:18px 30px 0 0;margin-right:30px;border-right:1px solid rgba(46,36,28,.16)}
.chk:last-child{border-right:0}
.chk .no{font-size:13px;letter-spacing:.2em;color:#8C3B21}
.chk .t{margin-top:6px;font-size:24px}
.foot{position:absolute;left:64px;right:64px;bottom:56px;display:flex;justify-content:space-between;font-size:15px;letter-spacing:.16em;color:#6E5E48}
</style></head><body>
<div class="art"><img src="davinci_raw.png"></div><div class="wash"></div><div class="frame"></div>
<div class="top"><span class="r"></span><span>交易会观察</span><b>AI 科普</b></div>
<h1>机器人上岗前<br><em>先过这三关</em></h1>
<div class="sub">展馆，是它们最容易考满分的考场。</div>
<div class="checks"><div class="chk"><div class="no">I</div><div class="t">连续干八小时</div></div>
<div class="chk"><div class="no">II</div><div class="t">普通人半天学会</div></div>
<div class="chk"><div class="no">III</div><div class="t">出错有人兜底</div></div></div>
<div class="foot"><span>mosjin · B站</span><span>2026.10</span></div>
</body></html>
