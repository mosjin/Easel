<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>交易会机器人变员工 · 达芬奇方图</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1080px; overflow: hidden; }
  body {
    background: #EFE6D2;
    color: #2E241C;
    font-family: "Noto Serif CJK SC", "Songti SC", serif;
    position: relative;
  }
  .art { position: absolute; inset: 0; overflow: hidden; }
  .art img {
    position: absolute; left: 0; top: 0;
    width: 100%; height: calc(100% + 40px);
    object-fit: cover; object-position: 78% 30%;
    filter: sepia(.12) contrast(1.03);
  }
  .wash {
    position: absolute; inset: 0;
    background:
      linear-gradient(180deg, rgba(239,230,210,0) 0%, rgba(239,230,210,.35) 34%, rgba(239,230,210,.95) 52%, #EFE6D2 62%),
      linear-gradient(90deg, rgba(239,230,210,.55) 0%, rgba(239,230,210,0) 55%);
  }

  .top {
    position: absolute; left: 64px; top: 54px; right: 64px;
    display: flex; align-items: center; justify-content: space-between;
    font-size: 13px; letter-spacing: .26em; color: #7A6A52;
  }
  .top .l { display: flex; align-items: center; gap: 10px; }
  .top .rule { width: 32px; height: 1px; background: #8C3B21; }
  .top b { color: #8C3B21; font-weight: 600; letter-spacing: .2em; }

  .body { position: absolute; left: 64px; right: 64px; bottom: 62px; }

  h1 {
    font-size: 82px; line-height: 1.14; font-weight: 700;
    letter-spacing: .01em;
  }
  h1 em { font-style: normal; color: #8C3B21; }

  .lede {
    margin-top: 22px;
    font-size: 24px; line-height: 1.55; color: #5B4B38;
  }

  .checks {
    margin-top: 34px;
    display: flex;
    border-top: 1px solid rgba(46,36,28,.28);
  }
  .chk { flex: 1; padding: 14px 16px 0 0; border-right: 1px solid rgba(46,36,28,.16); }
  .chk:last-child { border-right: 0; padding-right: 0; }
  .chk .no { font-size: 11px; letter-spacing: .2em; color: #8C3B21; }
  .chk .txt { margin-top: 6px; font-size: 20px; line-height: 1.4; }

  .foot {
    margin-top: 34px;
    display: flex; align-items: flex-end; justify-content: space-between;
    font-size: 12px; letter-spacing: .16em; color: #6E5E48;
  }
  .foot .big { display: block; font-size: 15px; letter-spacing: .08em; color: #3A2E23; margin-bottom: 4px; }
  .foot .r { text-align: right; }
</style>
</head>
<body>
  <div class="art"><img src="davinci_raw.png" alt=""></div>
  <div class="wash"></div>

  <div class="top">
    <div class="l"><span class="rule"></span><span>交易会观察</span><b>AI 科普</b></div>
    <div>2026.10</div>
  </div>

  <div class="body">
    <h1>机器人上岗前<br><em>先过这三关</em></h1>
    <p class="lede">展馆，是机器人最容易考满分的考场。</p>

    <div class="checks">
      <div class="chk"><div class="no">I</div><div class="txt">连续干八小时</div></div>
      <div class="chk"><div class="no">II</div><div class="txt">普通人半天学会</div></div>
      <div class="chk"><div class="no">III</div><div class="txt">出错有人兜底</div></div>
    </div>

    <div class="foot">
      <div><span class="big">手稿 No.140</span>小宁静致远 · 公众号</div>
      <div class="r">从展品<br>变员工</div>
    </div>
  </div>
</body>
</html>
